<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recall Console</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:32px}main{max-width:900px;margin:auto}form,section{background:white;border:1px solid #e4e8ef;border-radius:16px;padding:20px;margin:16px 0}input,select,textarea,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccd4df;border-radius:8px}button{background:#2563eb;color:white;border:0;cursor:pointer}.recall{border-top:1px solid #eee;padding:12px 0}</style></head>
<body><main><h1>Pharmaceutical Recall Console</h1><p>Create, review and publish product recalls.</p><form id="form"><input id="product" placeholder="Product name" required><input id="batch" placeholder="Batch number" required><select id="severity"><option>low</option><option>medium</option><option>high</option><option>critical</option></select><textarea id="reason" placeholder="Reason" required></textarea><button>Create recall</button></form><section><h2>Recalls</h2><div id="list">Loading...</div></section></main><script>const API=localStorage.getItem('RECALL_API')||'http://localhost:8000';const list=document.querySelector('#list');async function load(){try{const r=await fetch(API+'/api/v1/recalls');const data=await r.json();list.innerHTML=data.map(x=>`<div class="recall"><b>${x.product_name}</b> — ${x.batch_number}<br>Severity: ${x.severity} | Status: ${x.status}<br>${x.reason}</div>`).join('')||'No recalls yet';}catch(e){list.textContent='API unavailable: '+e.message}}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const payload={product_name:product.value,batch_number:batch.value,severity:severity.value,reason:reason.value};const r=await fetch(API+'/api/v1/recalls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)return alert(await r.text());e.target.reset();load()};load();</script></body></html>
